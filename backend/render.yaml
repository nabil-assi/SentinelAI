services:
  - type: web
    name: sentinel-ai-backend
    runtime: node
    repo: https://github.com/nabil-assi/SentinelAI
    rootDir: backend  # مهم جداً لمشروعك
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-ai-db
          property: connectionString

databases:
  - name: sentinel-ai-db
    plan: free
    databaseName: sentinel_ai_db